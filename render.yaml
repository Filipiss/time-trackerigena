services:
  # Backend Flask
  - type: web
    name: time-trackerigena-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DATABASE_URL
        sync: false # O link do banco de dados (ex: Neon PostgreSQL, Supabase ou Render PG)
      - key: JWT_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false # URL do frontend Vercel (ex: https://time-trackerigena.vercel.app)
